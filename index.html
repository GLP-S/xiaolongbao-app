<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小笼包">
<meta name="theme-color" content="#2B2F33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>小笼包 v3.0 · 标准溶液管理</title>
<!-- 单版本：本地优先（IndexedDB），联网经 server_url 自动双向同步 -->
<script src="store.js"></script>
<script src="db.js"></script>
<script src="label.js"></script>
<script src="dingtalk.js"></script>
<script src="api_local.js"></script>
<script src="bluetooth_print.js"></script>
<style>
:root{
  --bg:#2B2F33; --bg2:#24282C; --panel:#34393F; --panel2:#3C4249;
  --line:#454C54; --line2:#3A4047;
  --green:#8FBC8F; --green-d:#6E9C6E; --green-dd:#557E55;
  --text:#E8ECEA; --muted:#9AA2A8;
  --danger:#C46A66; --danger-d:#8E4C49; --warn:#D9B26A;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;
  font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1000px;margin:0 auto;background:var(--bg)}
/* ---------- 顶栏 ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);
  border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green);color:#1F2420;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0;
  box-shadow:0 3px 0 var(--green-dd)}
.title{font-size:16px;font-weight:700;white-space:nowrap}
.title .ver{font-size:11px;color:var(--muted);font-weight:500;margin-left:5px}
.net-dot{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:20px}
.net-dot .nd{width:8px;height:8px;border-radius:50%;display:inline-block}
.net-dot.online .nd{background:var(--green)}
.net-dot.offline .nd{background:var(--danger)}
.user-chip{font-size:12px;color:var(--text);background:var(--panel);border:1px solid var(--line);
  padding:4px 10px;border-radius:20px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- 主体 ---------- */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
/* ---------- 通用面板/文字 ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 12px;font-size:16px}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:6px 2px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-all}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
/* ---------- 按钮（3D 立体） ---------- */
.btn{border:none;border-radius:var(--radius);padding:11px 18px;font-size:14px;font-weight:700;
  cursor:pointer;background:var(--green);color:#20251F;box-shadow:0 4px 0 var(--green-dd);
  transition:transform .08s,box-shadow .08s;font-family:inherit;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dd)}
.btn.secondary{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #2A2E33;border:1px solid var(--line)}
.btn.secondary:active{box-shadow:0 1px 0 #2A2E33}
.btn.danger{background:var(--danger);color:#fff;box-shadow:0 4px 0 var(--danger-d)}
.btn.danger:active{box-shadow:0 1px 0 var(--danger-d)}
.btn.ghost{background:transparent;color:var(--green);box-shadow:none;border:1px solid var(--green-d)}
.btn.ghost:active{transform:translateY(2px);box-shadow:none}
.btn-sm{padding:7px 12px;border-radius:10px;font-size:13px;box-shadow:0 3px 0 var(--green-dd)}
.btn-sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-dd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* ---------- 表单 ---------- */
input,select,textarea{background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green-d)}
input[readonly]{color:var(--muted);cursor:not-allowed}
textarea{resize:vertical;min-height:60px}
.fld{display:block;margin-bottom:11px;font-size:13px;color:var(--muted)}
.fld>span{display:block;margin-bottom:5px}
.fld .inline{display:flex;gap:8px}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1}
/* ---------- 功能二级 pill ---------- */
.pills{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);
  color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit}
.pill.active{background:var(--green);color:#20251F;border-color:var(--green)}
/* ---------- 底部 Tab（按权限过滤） ---------- */
.tabbar{display:flex;background:var(--bg2);border-top:1px solid var(--line);flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;border:none;color:var(--muted);padding:8px 4px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-family:inherit;font-weight:600}
.tab.active{color:var(--green)}
.tab svg{width:22px;height:22px}
/* ---------- 表格 ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:9px 8px;color:var(--muted);font-weight:600;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl tr.rw{cursor:pointer}
.tbl tr.rw:active td{background:var(--panel2)}
.mini{padding:4px 9px;font-size:12px;border-radius:8px;box-shadow:0 2px 0 var(--green-dd)}
.mini:active{transform:translateY(2px);box-shadow:none}
.mini.secondary{box-shadow:0 2px 0 #2A2E33}
.mini.danger{box-shadow:0 2px 0 var(--danger-d)}
/* ---------- 状态标签 ---------- */
.tag{display:inline-block;padding:2px 9px;border-radius:8px;font-size:12px;font-weight:700}
.tag-in{background:rgba(143,188,143,.18);color:#9FCC9F}
.tag-out{background:rgba(196,106,102,.2);color:#E79C98}
.tag-used{background:rgba(217,178,106,.2);color:#E5C286}
.tag-discard{background:rgba(160,160,160,.18);color:#B8BEC3}
/* ---------- 库位棋盘（方形网格 × 圆形位点） ---------- */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;gap:8px;--slot:36px;
  grid-template-columns:repeat(var(--cols),var(--slot));margin:10px 0;width:max-content}
.slot{width:var(--slot);height:var(--slot);border-radius:50%;border:none;background:var(--green);
  color:#23301F;font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;
  justify-content:center;padding:0;font-family:inherit;transition:transform .08s}
.slot:active:not(.occ){transform:scale(.9)}
.slot.occ{background:#6C757D;color:#EDF0F2;cursor:not-allowed}
.slot.sel{background:#F2F5F1;color:#1F2420;
  box-shadow:0 0 0 3px var(--green-d),0 2px 6px rgba(0,0,0,.45)}
/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(10,12,14,.68);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:520px;
  max-width:92vw;max-height:88vh;overflow-y:auto;padding:18px}
.modal h3{margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.codebox{background:#fff;border-radius:12px;padding:10px;text-align:center}
.codebox .cap{color:#333;font-size:12px;font-weight:800;margin-bottom:6px}
.codebox img{max-width:100%;max-height:190px}
.codebox .pending{color:#888;font-size:12px}
@media(max-width:480px){.dual{grid-template-columns:1fr}}
/* ---------- 复选胶囊 ---------- */
.chk-row{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);
  padding:7px 12px;border-radius:20px;font-size:13px;color:var(--text);cursor:pointer}
.chk input{width:auto;accent-color:var(--green)}
/* ---------- 盒管理行 ---------- */
.boxrow{display:grid;grid-template-columns:1fr 104px 72px 72px 42px;gap:8px;
  align-items:center;margin-bottom:8px}
@media(max-width:480px){.boxrow{grid-template-columns:1fr 88px 60px 60px 38px}}
/* ---------- toast ---------- */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1E2226;
  border:1px solid var(--green-d);color:var(--text);padding:10px 18px;border-radius:12px;
  z-index:300;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:88vw}
/* ---------- 登录 ---------- */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:28px 24px;text-align:center}
.logo-big{width:72px;height:72px;border-radius:20px;background:var(--green);color:#1F2420;
  font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;box-shadow:0 6px 0 var(--green-dd)}
.login-card h1{font-size:20px;margin:6px 0 2px}
.login-card .sub{color:var(--muted);font-size:12px;margin-bottom:20px}
.login-card .err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}
.login-card .btn{width:100%;margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= 常量 ================= */
const APP_VERSION="3.0";
const ICONS={
  inout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>',
  query:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>',
  cfg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
};
/* 模块（Tab）定义：key 同时是权限码 */
const TABS=[
  {key:"inout",name:"出入库",funcs:[
    {key:"scan",name:"扫码出入库"},
    {key:"receive",name:"入库登记"}]},
  {key:"query",name:"查询",funcs:[
    {key:"stock",name:"库存查询"},
    {key:"logs",name:"流水台账"}]},
  {key:"check",name:"盘点",funcs:[
    {key:"stocktake",name:"扫码盘点"}]},
  {key:"cfg",name:"设置",funcs:[
    {key:"settings",name:"参数设置"},
    {key:"users",name:"账号管理",adminOnly:true},
    {key:"boxes",name:"库位管理",adminOnly:true}]}
];
const PERM_LABELS=[["inout","出入库"],["query","查询统计"],["check","盘点"],["cfg","系统设置"]];

let state={user:null,role:null,perms:[],token:"",tab:"inout",func:"scan"};
let activeView=null;
let $app=null;

/* ================= 工具 ================= */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html;return e}
function q(box,sel){return box.querySelector(sel)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=el("div","toast");t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),1900)}
function tagCls(s){return s==="在库"?"tag-in":s==="已出库"?"tag-out":
  s==="已取用"?"tag-used":"tag-discard"}

/* ================= API 层 =================
   单版本：始终本地优先（XLBLocalApi → IndexedDB）；
   写操作本地完成后由 syncNow 经 server_url 双向同步；
   远程 fetch 一律带 Authorization: Bearer token。 */
async function api(path,opt={}){
  if(window.XLBLocalApi){
    const qi=path.indexOf("?");let p=path,params={};
    if(qi>=0){
      p=path.slice(0,qi);
      new URLSearchParams(path.slice(qi+1)).forEach((v,k)=>params["_"+k]=v);
    }
    return await XLBLocalApi.localApi(p,{...opt,...params});
  }
  return await remoteApi(path,opt);
}
async function remoteApi(path,opt={}){
  const h={"Content-Type":"application/json"};
  if(state.token)h["Authorization"]="Bearer "+state.token;
  const r=await fetch(path,{headers:h,...opt});
  const ct=r.headers.get("content-type")||"";
  if(ct.includes("json")){const j=await r.json();
    if(!r.ok)throw new Error(j.msg||j.error||"请求失败");return j}
  if(!r.ok)throw new Error("请求失败 HTTP "+r.status);
  return r;
}
/* 写操作统一入口：成功即广播 data-changed（全局刷新 + 触发自动同步） */
async function apiWrite(path,body){
  const j=await api(path,{method:"POST",body:JSON.stringify(body||{})});
  window.dispatchEvent(new Event("data-changed"));
  return j;
}
async function apiDelete(path,body){
  const j=await api(path,{method:"DELETE",body:JSON.stringify(body||{})});
  window.dispatchEvent(new Event("data-changed"));
  return j;
}

/* ================= 会话 ================= */
const SESS_KEY="xlb_session_v3";
function saveSession(s){try{localStorage.setItem(SESS_KEY,JSON.stringify(s))}catch(e){}}
function loadSession(){try{return JSON.parse(localStorage.getItem(SESS_KEY))}catch(e){return null}}
function clearSession(){try{localStorage.removeItem(SESS_KEY)}catch(e){}}

const isNative=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&
  window.Capacitor.isNativePlatform());

/* ================= 权限 ================= */
function tabAllowed(key){return state.role==="admin"||state.perms.includes(key)}
function visibleFuncs(tab){return tab.funcs.filter(f=>!f.adminOnly||state.role==="admin")}
function firstAllowedTab(){const t=TABS.find(t=>tabAllowed(t.key));return t?t.key:null}
function firstFuncKey(tabKey){
  const t=TABS.find(t=>t.key===tabKey);const fs=visibleFuncs(t);
  return fs.length?fs[0].key:null;
}

/* ================= 同步（syncNow） ================= */
let _syncing=false,_syncTimer=null;
async function doSync(manual){
  if(_syncing)return{ok:false,msg:"正在同步中…"};
  if(!navigator.onLine)return{ok:false,msg:"当前处于离线状态"};
  if(!window.XLBLocalApi)return{ok:false,msg:"本地存储不可用"};
  if(!window.__xlb_sync_cred)return{ok:false,msg:"请退出并重新登录后再同步"};
  _syncing=true;updateNetUI();
  try{
    const r=await XLBLocalApi.syncNow();
    if(r&&r.ok){
      localStorage.setItem("xlb_last_ts",new Date().toLocaleString());
      window.dispatchEvent(new Event("data-changed"));
      window.dispatchEvent(new Event("xlb-sync-done"));
    }
    return r||{ok:false,msg:"同步失败"};
  }catch(e){return{ok:false,msg:e.message}}
  finally{_syncing=false;updateNetUI();}
}
function scheduleSync(){
  clearTimeout(_syncTimer);
  if(navigator.onLine&&window.XLBLocalApi&&XLBLocalApi.isDirty()&&window.__xlb_sync_cred){
    _syncTimer=setTimeout(()=>doSync(false),3000);
  }
}
window.addEventListener("data-changed",()=>{
  if(activeView&&activeView.reload){
    try{const r=activeView.reload();if(r&&r.catch)r.catch(()=>{})}catch(e){}
  }
  scheduleSync();
});
window.addEventListener("online",()=>{updateNetUI();doSync(false)});
window.addEventListener("offline",()=>updateNetUI());
setInterval(updateNetUI,5000);
setInterval(()=>{if(window.XLBLocalApi&&XLBLocalApi.isDirty())doSync(false)},60000);

function updateNetUI(){
  const dot=q($app,"#netdot");if(!dot)return;
  const online=navigator.onLine,dirty=!!(window.XLBLocalApi&&XLBLocalApi.isDirty());
  const last=localStorage.getItem("xlb_last_ts");
  dot.className="net-dot "+(online?"online":"offline");
  dot.innerHTML=online
    ?(dirty?'<span class="nd"></span>待同步':'<span class="nd"></span>在线')
    :'<span class="nd"></span>离线';
  dot.title=last?("上次同步："+last):"尚未与服务器同步";
}

/* ================= 渲染入口 ================= */
function render(){
  $app.innerHTML="";
  if(!state.user){renderLogin();return}
  /* 顶栏 */
  const bar=el("div","bar");
  bar.innerHTML=`<div class="brand"><span class="logo">小</span>
    <span class="title">小笼包<span class="ver">v${APP_VERSION}</span></span></div>
    <div class="net-dot" id="netdot"></div>
    <div class="user-chip">${esc(state.user)}</div>
    <button class="btn btn-sm secondary" id="logout">退出</button>`;
  $app.appendChild(bar);
  q(bar,"#logout").onclick=doLogout;
  updateNetUI();
  /* 主体 */
  const main=el("div","main");$app.appendChild(main);
  const tab=TABS.find(t=>t.key===state.tab);
  const funcs=visibleFuncs(tab);
  if(funcs.length>1){
    const pills=el("div","pills");
    funcs.forEach(f=>{
      const p=el("button","pill"+(f.key===state.func?" active":""),f.name);
      p.onclick=()=>{state.func=f.key;render()};
      pills.appendChild(p);
    });
    main.appendChild(pills);
  }
  const view=el("div");main.appendChild(view);
  const vf=VIEWS[state.func];
  const r=vf?vf(view):null;
  activeView={el:view,reload:r&&typeof r.reload==="function"?r.reload:null};
  /* 底部 Tab（权限过滤） */
  const tb=el("div","tabbar");
  TABS.filter(t=>tabAllowed(t.key)).forEach(t=>{
    const b=el("button","tab"+(t.key===state.tab?" active":""),
      ICONS[t.key]+`<span>${t.name}</span>`);
    b.onclick=()=>{state.tab=t.key;state.func=firstFuncKey(t.key);render()};
    tb.appendChild(b);
  });
  $app.appendChild(tb);
}

function doLogout(){
  state={user:null,role:null,perms:[],token:"",tab:"inout",func:"scan"};
  if(window.XLBLocalApi)XLBLocalApi.setSession(null);
  window.__xlb_sync_cred=null;
  clearSession();
  activeView=null;
  render();
}

/* ================= 登录 ================= */
function renderLogin(){
  const w=el("div","login-wrap");
  w.innerHTML=`<div class="login-card">
    <div class="logo-big">小</div>
    <h1>标准溶液管理系统</h1>
    <div class="sub">小笼包 v${APP_VERSION} · 本地优先 · 联网自动同步</div>
    <div class="err" id="lerr"></div>
    <input id="luser" placeholder="账号" autocomplete="off" autocapitalize="none">
    <input id="lpass" type="password" placeholder="密码" style="margin-top:10px">
    <button class="btn" id="lbtn">登 录</button>
    <div class="hint" style="margin-top:14px">默认管理员账号 admin / 初始密码 admin123</div>
  </div>`;
  $app.appendChild(w);
  q(w,"#luser").focus();
  const doLogin=async()=>{
    const user=q(w,"#luser").value.trim(),pass=q(w,"#lpass").value;
    if(!user){q(w,"#lerr").textContent="请输入账号";return}
    try{
      const j=await api("/api/login",
        {method:"POST",body:JSON.stringify({user,pass})});
      state.user=j.user;state.role=j.role;state.perms=j.perms||[];state.token=j.token;
      /* 同步凭据仅存内存，供 syncNow 向服务器换取 Bearer token */
      window.__xlb_sync_cred={user:j.user,pass:pass};
      if(window.XLBLocalApi)XLBLocalApi.setSession(
        {user:j.user,role:j.role,perms:state.perms});
      saveSession({user:j.user,role:j.role,perms:state.perms});
      const tab=firstAllowedTab();
      state.tab=tab||"inout";state.func=firstFuncKey(state.tab)||"scan";
      render();
      maybeDefaultServer();
    }catch(e){q(w,"#lerr").textContent=e.message}
  };
  q(w,"#lbtn").onclick=doLogin;
  q(w,"#lpass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
  q(w,"#luser").addEventListener("keydown",
    e=>{if(e.key==="Enter")q(w,"#lpass").focus()});
}
/* 由服务器同源托管时，管理员登录后自动把当前站点作为同步服务器 */
async function maybeDefaultServer(){
  if(state.role!=="admin"||isNative)return;
  if(!/^https?:/.test(location.origin))return;
  try{
    const cfg=await api("/api/config");
    if(!cfg.server_url){
      await api("/api/config",
        {method:"POST",body:JSON.stringify({server_url:location.origin})});
    }
  }catch(e){}
}

/* ================= 页面：扫码出入库 ================= */
function pageScan(box){
  box.innerHTML=`<div class="searchbar">
      <input id="f_scan" placeholder="扫码枪扫描瓶码 / 品种二维码" autocomplete="off">
      <button class="btn" id="f_scanbtn">查询</button></div>
    <div class="hint">在库瓶可整瓶取用 / 出库；已出库或已取用瓶扫码后直接归还入库。</div>
    <div id="f_scanres"></div>`;
  const inp=q(box,"#f_scan"),res=q(box,"#f_scanres");
  async function run(){
    const code=inp.value.trim();if(!code)return;
    inp.value="";
    try{
      const j=await api("/api/scan",
        {method:"POST",body:JSON.stringify({code})});
      show(j);
    }catch(e){toast(e.message)}
    inp.focus();
  }
  q(box,"#f_scanbtn").onclick=run;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")run()});
  setTimeout(()=>inp.focus(),60);

  function show(j){
    res.innerHTML="";
    if(j.type==="product"){
      const p=j.product;
      if(p){
        const pan=el("div","panel",`<h3>品种档案：${esc(p.name)}</h3>
          <div class="kv">
            <span class="k">标准编号</span><span class="v">${esc(p.std_id)}</span>
            <span class="k">浓度</span><span class="v">${esc(p.conc)} ${esc(p.unit)}</span>
            <span class="k">批号</span><span class="v">${esc(p.batch)}</span>
            <span class="k">首次入库</span><span class="v">${esc(p.first_date)}</span></div>
          <div class="actions">
            <button class="btn" id="goRecv">带入入库</button>
            <button class="btn secondary" id="closeBtn">关闭</button></div>`);
        res.appendChild(pan);
        q(pan,"#goRecv").onclick=()=>{
          state.prefill={std_id:p.std_id,conc:p.conc,unit:p.unit,batch:p.batch};
          state.func="receive";render();
        };
        q(pan,"#closeBtn").onclick=()=>{res.innerHTML=""};
      }else{
        const o=j.qr||{};
        const join=a=>Array.isArray(a)?a.join("、"):String(a||"");
        const pan=el("div","panel",`<h3>品种二维码</h3>
          <div class="hint" style="color:var(--warn)">本地尚未建立该品种档案（可能来自其他设备）</div>
          <div class="kv">
            <span class="k">溶液名称</span><span class="v">${esc(o["溶液名称"])}</span>
            <span class="k">储存位置</span><span class="v">${esc(join(o["储存位置"])||"—")}</span>
            <span class="k">剩余数量</span><span class="v">${o["剩余数量"]!=null?esc(o["剩余数量"]):"—"}</span>
            <span class="k">项目号</span><span class="v">${esc(join(o["项目号"])||"—")}</span>
            <span class="k">配置人</span><span class="v">${esc(o["配置人"])}</span>
            <span class="k">生产日期</span><span class="v">${esc(o["生产日期"])}</span></div>
          <div class="actions"><button class="btn secondary" id="closeBtn">关闭</button></div>`);
        res.appendChild(pan);
        q(pan,"#closeBtn").onclick=()=>{res.innerHTML=""};
      }
      return;
    }
    /* 瓶码 */
    const it=j.item,st=it.status;
    let actHtml="";
    if(st==="在库"){
      actHtml+=`<button class="btn" data-a="use">整瓶取用</button>
        <button class="btn secondary" data-a="out">整瓶出库</button>`;
    }else if(st==="已出库"||st==="已取用"){
      actHtml+=`<button class="btn" data-a="return">归还入库</button>`;
    }else{
      actHtml+=`<span class="tag tag-discard">${esc(st)}</span>`;
    }
    actHtml+=`<button class="btn ghost" data-a="reprint">补打标签</button>
      <button class="btn secondary" data-a="close">关闭</button>`;
    const pan=el("div","panel",`<h3>${esc(it.name)}
        <span class="tag ${tagCls(st)}">${esc(st)}</span></h3>
      <div class="kv">
        <span class="k">瓶号</span><span class="v">${esc(it.bottle_id)}</span>
        <span class="k">浓度</span><span class="v">${esc(it.conc)} ${esc(it.unit)}</span>
        <span class="k">批号</span><span class="v">${esc(it.batch)}</span>
        <span class="k">库位</span><span class="v">${esc(it.location||"—")}</span>
        <span class="k">有效期至</span><span class="v">${esc(it.exp_date)}${it.open_exp_date?`（开封效期 ${esc(it.open_exp_date)}）`:""}</span></div>
      <div class="actions">${actHtml}</div>`);
    res.appendChild(pan);
    q(pan,".actions").addEventListener("click",async e=>{
      const b=e.target.closest("button");if(!b)return;
      const a=b.dataset.a;
      try{
        if(a==="close"){res.innerHTML="";return}
        if(a==="use"||a==="out"){
          await apiWrite("/api/issue",
            {bottle_id:it.bottle_id,action:a,operator:state.user});
          res.innerHTML="";toast(a==="use"?"已整瓶取用":"已整瓶出库");
        }else if(a==="return"){
          const opened=confirm("归还时是否首次开封？");
          await apiWrite("/api/return",
            {bottle_id:it.bottle_id,opened:!!opened,operator:state.user});
          res.innerHTML="";toast("归还入库成功");
        }else if(a==="reprint"){
          await doReprint(it.bottle_id);
        }
      }catch(err){toast(err.message)}
    });
  }
  return{reload(){}};
}

/* 补打标签：本地渲染瓶签 dataURL → 新窗口打印 */
async function doReprint(bid){
  try{
    const j=await api("/api/label_data/"+encodeURIComponent(bid));
    if(j&&j.image){printImages([j.image])}else toast("未取得标签图片");
  }catch(e){toast(e.message)}
}
function printImages(urls){
  const w=window.open("","_blank");
  if(!w){toast("请允许弹出窗口以打印");return}
  let html=`<html><head><title>打印标签</title>
    <style>@media print{.pg{page-break-after:always}}.pg{text-align:center;margin:0}
    img{max-width:100%}</style></head><body style="margin:8px">`;
  urls.forEach(u=>{html+=`<div class="pg"><img src="${u}"></div>`});
  html+=`<script>window.onload=function(){window.print();setTimeout(function(){window.close()},400)};<\/script></body></html>`;
  w.document.write(html);w.document.close();
}

let _locData=null;          // /api/locations 缓存
let _selectedLocs=[];       // 已选库位
async function loadLocData(force){

async function buildForm(box,f){
  const cfg=await api("/api/config");
  const units=(cfg.units||"mL\nL\ng\nmg").split("\n").filter(Boolean);
  box.innerHTML=`
    <label class="fld"><span>溶液名称（自动生成）</span>
      <input id="r_name" readonly placeholder="填写编号/浓度/批号后自动生成"></label>
    <div class="grid2">
      <label class="fld"><span>标准物质编号 *</span><input id="r_std" value="${esc(f.std_id||"")}"></label>
      <label class="fld"><span>浓度/规格 *</span><input id="r_conc" value="${esc(f.conc||"")}" placeholder="如 0.1000 mol/L"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span>单位</span><select id="r_unit">
        ${units.map(u=>`<option ${u===(f.unit||"mL")?"selected":""}>${esc(u)}</option>`).join("")}</select></label>
      <label class="fld"><span>批号（4 位数字）*</span><input id="r_batch" value="${esc(f.batch||"")}" maxlength="4"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span>配置人</span><input id="r_maker"></label>
      <label class="fld"><span>生产日期</span><input id="r_prod" type="date"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span>有效期至</span><input id="r_exp" type="date"></label>
      <label class="fld"><span>规格(mL/g)</span><input id="r_init" type="number" step="0.01" placeholder="如 500"></label>
    </div>
    <label class="fld"><span>开封后效期</span><span class="inline">
      <input id="r_olv" type="number" placeholder="如 30" style="flex:1">
      <select id="r_olu" style="width:90px"><option>天</option><option>月</option></select></span></label>
    <label class="fld"><span>库位（先选盒，再点击圆形位点，可多选）</span>
      <select id="r_boxsel"></select>
      <div class="board-wrap"><div class="board" id="r_board"></div></div></label>
    <div class="grid2">
      <label class="fld"><span>入库数量</span><input id="r_qty" type="number" value="1" min="1" max="999"></label>
      <label class="fld"><span>经办人</span><input id="r_op" value="${esc(cfg.default_operator||"")}"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span>项目编号</span><input id="r_proj"></label>
      <label class="fld"><span>溶剂</span><input id="r_sol"></label>
    </div>
    <label class="fld"><span>备注</span><textarea id="r_note"></textarea></label>
    <div class="actions">
      <button class="btn" id="saveprint">保存并打印标签</button>
      <button class="btn secondary" id="saveonly">仅保存</button></div>`;

  /* 名称派生 */
  const syncName=()=>{
    q(box,"#r_name").value=XLBStore.deriveName(
      q(box,"#r_std").value,q(box,"#r_conc").value,
      q(box,"#r_unit").value,q(box,"#r_batch").value);
  };
  ["r_std","r_conc","r_batch"].forEach(id=>q(box,"#"+id).addEventListener("input",syncName));
  q(box,"#r_unit").addEventListener("change",syncName);
  syncName();

  /* 盒下拉 + 圆形棋盘 */
  const data=await loadLocData(true);
  const sel=q(box,"#r_boxsel");
  sel.innerHTML=data.boxes.map(b=>`<option value="${b.prefix}">${esc(b.label)}（${b.rows}×${b.cols}）</option>`).join("");
  const drawBoard=()=>{
    const prefix=sel.value;
    const b=data.boxes.find(x=>x.prefix===prefix);
    const board=q(box,"#r_board");
    board.innerHTML="";
    board.style.setProperty("--cols",b.cols);
    const occ=new Set(data.occupied);
    for(let s=1;s<=b.slots;s++){
      const loc=prefix+s;
      const btn=el("button","slot"+(occ.has(loc)?" occ":"")+
        (_selectedLocs.includes(loc)?" sel":""),String(s));
      btn.onclick=()=>{
        if(btn.classList.contains("occ"))return;
        btn.classList.toggle("sel");
        if(btn.classList.contains("sel"))_selectedLocs.push(loc);
        else _selectedLocs=_selectedLocs.filter(l=>l!==loc);
      };
      board.appendChild(btn);
    }
  };
  sel.addEventListener("change",drawBoard);
  drawBoard();

  /* 保存 */
  const doSave=async(printAfter)=>{
    const stdV=q(box,"#r_std").value.trim(),
      concV=q(box,"#r_conc").value.trim(),
      batchV=q(box,"#r_batch").value.trim();
    if(!stdV){toast("请填写标准物质编号");return}
    if(!concV){toast("请填写浓度/规格");return}
    if(!batchV){toast("请填写批号");return}
    if(!/^\d{4}$/.test(batchV)){toast("批号必须为 4 位数字（如 0001）");return}
    const form={
      name:q(box,"#r_name").value.trim(),std_id:stdV,conc:concV,
      unit:q(box,"#r_unit").value,batch:batchV,
      maker:q(box,"#r_maker").value.trim(),
      prod_date:q(box,"#r_prod").value,exp_date:q(box,"#r_exp").value,
      init_amount:q(box,"#r_init").value,
      open_limit_value:q(box,"#r_olv").value,
      open_limit_unit:q(box,"#r_olu").value,
      location:_selectedLocs.join(","),
      operator:q(box,"#r_op").value.trim(),
      project_no:q(box,"#r_proj").value.trim(),
      solvent:q(box,"#r_sol").value.trim(),
      note:q(box,"#r_note").value.trim()};
    const qty=parseInt(q(box,"#r_qty").value)||1;
    try{
      const j=await apiWrite("/api/receive",{...form,qty});
      toast(`入库成功：${j.bottle_ids.length} 瓶`);
      if(printAfter){
        const images=[];
        try{
          const c2=await api("/api/config");
          const payload=await api("/api/product_qr?code="+
            encodeURIComponent(j.product_code));
          images.push(XLBLabel.renderProductQR(payload,c2));
        }catch(e){}
        for(const bid of j.bottle_ids){
          try{
            const d=await api("/api/label_data/"+encodeURIComponent(bid));
            if(d.image)images.push(d.image);
          }catch(e){}
        }
        if(images.length)printImages(images);
      }
      _selectedLocs=[];
      buildForm(box,{});
    }catch(e){toast(e.message)}
  };
  q(box,"#saveprint").onclick=()=>doSave(true);
  q(box,"#saveonly").onclick=()=>doSave(false);
}

/* ================= 页面：库存查询（弹窗双码） ================= */
function pageStock(box){
  box.innerHTML=`<div class="searchbar">
      <input id="f_sq" placeholder="瓶号 / 名称 / 编号 / 库位">
      <select id="f_sst" style="width:104px">
        <option value="">全部状态</option>

    <div class="tbl-wrap" id="f_sres"></div>`;
  async function load(){
    const kw=q(box,"#f_sq").value,s=q(box,"#f_sst").value;

      "&status="+encodeURIComponent(s));

      wrap.innerHTML=`<div class="hint" style="text-align:center;padding:18px">无匹配数据</div>`;

    const tb=el("table","tbl",`<thead><tr>

      <th>库位</th><th>状态</th><th>有效期</th><th>操作</th>
      </tr></thead><tbody></tbody>`);
    const tbod=q(tb,"tbody");
    items.forEach(it=>{
      const tr=el("tr","rw",`<td>${esc(it.bottle_id)}</td>
        <td>${esc(it.name)}</td>
        <td>${esc(it.conc||"")} ${esc(it.unit||"")}</td>
        <td>${esc(it.batch||"")}</td>
        <td>${esc(it.location||"")}</td>
        <td><span class="tag ${tagCls(it.status)}">${esc(it.status)}</span></td>
        <td>${esc(it.exp_date||"")}</td>
        <td><button class="btn mini secondary" data-op="reprint">补打</button>
          <button class="btn mini danger" data-op="discard">作废</button></td>`);
      tr.addEventListener("click",e=>{
        if(e.target.closest("button"))return;
        openItemModal(it);
      });
      q(tr,"[data-op=reprint]").addEventListener("click",
        e=>{e.stopPropagation();doReprint(it.bottle_id)});
      q(tr,"[data-op=discard]").addEventListener("click",async e=>{
        e.stopPropagation();
        const reason=prompt("作废原因：")||"";
        if(!reason){toast("需填写作废原因");return}
        try{
          await apiWrite("/api/discard",
            {bottle_id:it.bottle_id,reason,operator:state.user});
          toast("已作废");
        }catch(err){toast(err.message)}
      });
      tbod.appendChild(tr);
    });
    wrap.innerHTML="";wrap.appendChild(tb);
  }
  q(box,"#f_sbtn").onclick=load;
  q(box,"#f_sq").addEventListener("keydown",e=>{if(e.key==="Enter")load()});
  load();
  return{reload:load};
}

/* ================= 页面：流水台账 ================= */
function pageLogs(box){
  box.innerHTML=`<div class="searchbar">
      <input id="f_lq" placeholder="瓶号 / 名称 / 操作人">
      <input id="f_ldays" type="number" placeholder="最近N天" style="width:100px">
      <button class="btn" id="f_lbtn">查询</button>
      <button class="btn secondary" id="f_lexp">导出CSV</button></div>
    <div class="tbl-wrap" id="f_lres" style="margin-top:10px"></div>`;
  async function load(){
    const kw=q(box,"#f_lq").value,d=q(box,"#f_ldays").value;
    let url="/api/logs?";
    if(kw)url+="q="+encodeURIComponent(kw)+"&";
    if(d)url+="days="+encodeURIComponent(d);
    const logs=await api(url);
    const wrap=q(box,"#f_lres");
    if(!logs.length){
      wrap.innerHTML=`<div class="hint" style="text-align:center;padding:18px">无数据</div>`;
      return;
    }
    wrap.innerHTML="";
    const tb=el("table","tbl",`<thead><tr>
      <th>时间</th><th>瓶号</th><th>名称</th><th>操作</th>
      <th>操作人</th><th>备注</th></tr></thead><tbody>
      ${logs.map(l=>`<tr><td>${esc(l.time)}</td><td>${esc(l.bottle_id)}</td>
      <td>${esc(l.name)}</td><td>${esc(l.action)}</td>
      <td>${esc(l.operator)}</td><td>${esc(l.note)}</td></tr>`).join("")}
      </tbody>`);
    wrap.appendChild(tb);
  }
  q(box,"#f_lbtn").onclick=load;
  q(box,"#f_lq").addEventListener("keydown",e=>{if(e.key==="Enter")load()});
  q(box,"#f_lexp").onclick=async()=>{
    const logs=await api("/api/logs");
    if(!logs.length){toast("无数据可导出");return}
    const headers=["流水号","时间","瓶号","溶液名称","操作类型","数量","单位","领用人","用途","经办人","备注"];
    const keys=["log_id","time","bottle_id","name","action","qty","unit","person","purpose","operator","note"];
    let csv="\uFEFF"+headers.join(",")+"\n";
    for(const l of logs){
      csv+=keys.map(k=>`"${String(l[k]||"").replace(/"/g,'""')}"`).join(",")+"\n";
    }
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`出入库流水_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };
  load();
  return{reload:load};
}

/* ================= 页面：扫码盘点 ================= */
function pageStocktake(box){
  let scope=[],found=[];
  box.innerHTML=`<div class="panel">
      <div class="actions" style="margin-top:0">
        <button class="btn" id="t_start">开始盘点（全部在库）</button>
        <button class="btn secondary" id="t_rep">生成差异报告</button></div>
      <div class="hint" id="t_stat">尚未开始</div>
      <div class="searchbar">
        <input id="t_scan" placeholder="扫描在库瓶码" autocomplete="off">
        <button class="btn secondary" id="t_btn">记入</button></div>
      <div id="t_result"></div></div>`;
  q(box,"#t_start").onclick=async()=>{
    const items=await api("/api/items?status="+encodeURIComponent("在库"));
    scope=items.map(i=>i.bottle_id);found=[];
    q(box,"#t_result").innerHTML="";
    q(box,"#t_stat").textContent=`盘点进行中：已扫 0 / ${scope.length} 瓶`;
    toast(`盘点开始：共 ${scope.length} 瓶在库`);
    q(box,"#t_scan").focus();
  };
  const addScan=()=>{
    const code=q(box,"#t_scan").value.trim();if(!code)return;
    q(box,"#t_scan").value="";
    if(found.includes(code)){toast("该瓶已扫，请勿重复")}
    else{
      found.push(code);
      if(!scope.includes(code))toast("注意：该瓶不在在库清单中");
    }
    q(box,"#t_stat").textContent=`盘点进行中：已扫 ${found.length} / ${scope.length} 瓶`;
    q(box,"#t_scan").focus();
  };
  q(box,"#t_btn").onclick=addScan;
  q(box,"#t_scan").addEventListener("keydown",e=>{if(e.key==="Enter")addScan()});
  q(box,"#t_rep").onclick=async()=>{
    if(!scope.length){toast("请先开始盘点");return}
    const r=await api("/api/stocktake/report",
      {method:"POST",body:JSON.stringify({found:found,scope:scope})});
    const rows=[
      ...(r.missing||[]).map(bid=>({type:"盘亏（未扫到）",bid})),
      ...(r.extra||[]).map(bid=>({type:"多出（非在库）",bid}))
    ];
    q(box,"#t_result").innerHTML=`<hr class="sep">
      <h3 style="font-size:15px">差异报告</h3>
      <div class="hint">应盘 ${r.total} 瓶，实扫 ${r.found} 瓶，差异 ${r.diff} 项</div>
      ${rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th>类型</th><th>瓶号</th></tr></thead><tbody>
        ${rows.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.bid)}</td></tr>`).join("")}
        </tbody></table></div>`
      :'<div class="hint">无差异，账实相符。</div>'}`;
  };
  return{reload(){}};
}

          persons:q(box,"#s_persons").value,
          units:q(box,"#s_units").value});
        toast("设置已保存");
      }catch(e){toast(e.message)}
    };
    /* 钉钉按钮：本机直推（Android 原生网络 / iPad no-cors 直连），不依赖同步服务器 */
    q(box,"#s_dttest").onclick=async()=>{

                   dingtalk_secret:q(box,"#s_dts").value};

      toast("正在发送…");

      const cnt=v=>items.filter(i=>i.status===v).length;
      const todayS=new Date().toISOString().slice(0,10);
      const tLogs=st.logs.filter(l=>String(l.time||"").startsWith(todayS));

        "- 库存总瓶数："+items.length,
        "- 在库："+cnt("在库")+"　已出库："+cnt("已出库")+

        "- 品种数："+Object.keys(st.products).length,
        "- 今日流水："+tLogs.length+" 条"];

      a.download=`小笼包备份_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    };

      if(!confirm("确定清空本机全部业务数据？此操作不可恢复。"))return;
      if(!confirm("再次确认：服务器数据不受影响，是否继续？"))return;

    let s=(v||"").trim().replace(/\/+$/,"");
    if(!s)return"";
    if(!/^https?:\/\//i.test(s))s="http://"+s;
    return s;
  }
  async function serverApiCall(box,path,body){
    const base=normUrl(q(box,"#s_url").value)||
      (!isNative&&/^https?:/.test(location.origin)?location.origin:"");
    if(!base)throw new Error("请先配置并保存服务器地址");
    const r=await fetch(base+path,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body||{})});
    const j=await r.json().catch(()=>({msg:"HTTP "+r.status}));
    if(!r.ok)throw new Error(j.msg||("HTTP "+r.status));
    return j;
  }
  load();
  return{reload:load};
}

/* ================= 页面：账号管理（admin） ================= */
function pageUsers(box){
  box.innerHTML=`<div class="panel"><h3>新增账号</h3>
      <div class="grid2">
        <label class="fld"><span>账号</span><input id="u_name" autocomplete="off"></label>
        <label class="fld"><span>初始密码（留空为 123456）</span><input id="u_pass"></label></div>
      <label class="fld"><span>权限</span><div class="chk-row" id="u_perms">
        ${PERM_LABELS.map(([k,v],i)=>`<label class="chk"><input type="checkbox" value="${k}"
          ${i<2?"checked":""}>${v}</label>`).join("")}</div></label>
      <div class="actions"><button class="btn" id="u_add">创建账号</button></div></div>
    <div class="panel"><h3>账号列表</h3><div id="u_list" class="hint">加载中…</div></div>`;

  q(box,"#u_add").onclick=async()=>{
    const user=q(box,"#u_name").value.trim(),
      pass=q(box,"#u_pass").value;
    if(!user){toast("请填写账号");return}
    const perms=[...q(box,"#u_perms").querySelectorAll("input:checked")].map(c=>c.value);
    try{
      await apiWrite("/api/users",{user,pass,perms});
      q(box,"#u_name").value="";q(box,"#u_pass").value="";
      toast("账号已创建");
    }catch(e){toast(e.message)}
  };
  async function loadList(){
    const list=await api("/api/users");
    const wrap=q(box,"#u_list");
    wrap.className="";
    wrap.innerHTML="";
    const tb=el("table","tbl",`<thead><tr>
      <th>账号</th><th>角色</th><th>权限</th><th>操作</th></tr></thead><tbody></tbody>`);
    list.forEach(u=>{
      const tr=el("tr",null,`<td>${esc(u.user)}</td>
        <td>${u.role==="admin"?'<span class="tag tag-in">管理员</span>':'普通用户'}</td>
        <td><div class="chk-row">
          ${PERM_LABELS.map(([k])=>`<label class="chk" style="padding:4px 9px">
            <input type="checkbox" value="${k}" ${u.role==="admin"||(u.perms||[]).includes(k)?"checked":""}
            ${u.role==="admin"?"disabled":""}>${PERM_LABELS.find(x=>x[0]===k)[1]}</label>`).join("")}
        </div></td>
        <td><button class="btn mini danger">删除</button></td>`);
      q(tr,".chk-row").addEventListener("change",async()=>{
        const perms=[...q(tr,".chk-row").querySelectorAll("input:checked")].map(c=>c.value);
        try{
          await apiWrite("/api/users",{action:"set_perms",user:u.user,perms});
          toast("权限已更新");
        }catch(e){toast(e.message);loadList()}
      });
      q(tr,"button").onclick=async()=>{
        if(!confirm("确定删除账号「"+u.user+"」？"))return;
        try{
          await apiDelete("/api/users",{user:u.user});
          toast("账号已删除");
        }catch(e){toast(e.message)}
      };
      q(tb,"tbody").appendChild(tr);
    });
    wrap.appendChild(tb);
  }
  loadList();
  return{reload:loadList};
}

/* ================= 页面：库位管理（admin） ================= */
function pageBoxes(box){
  let rows=[];
  box.innerHTML=`<div class="panel">
      <h3>盒位定义（库位棋盘按盒行列渲染为圆形位点）</h3>
      <div id="b_rows" class="hint">加载中…</div>
      <div class="actions">
        <button class="btn secondary" id="b_add">添加盒</button>
        <button class="btn" id="b_save">保存全部</button></div>
      <div class="hint">有在库瓶的盒不允许删除；修改行列数后棋盘格位数随之变化。</div></div>`;
  async function load(){
    const boxes=await api("/api/boxes");
    rows=boxes.map(b=>({id:b.id,type:b.type,rows:b.rows,cols:b.cols}));
    renderRows();
  }
  function renderRows(){
    const wrap=q(box,"#b_rows");
    wrap.className="";
    wrap.innerHTML="";
    rows.forEach((r,i)=>{
      const row=el("div","boxrow",`
        <span class="hint" style="margin:0">盒 #${r.id}</span>
        <select data-f="type">
          <option value="small" ${r.type==="small"?"selected":""}>小盒</option>
          <option value="big" ${r.type==="big"?"selected":""}>大盒</option></select>
        <input type="number" min="1" max="20" data-f="rows" value="${r.rows}">
        <input type="number" min="1" max="20" data-f="cols" value="${r.cols}">
        <button class="btn mini danger" data-f="del">×</button>`);
      row.querySelectorAll("[data-f]").forEach(inp=>{
        inp.addEventListener("change",()=>{
          const f=inp.dataset.f;
          if(f==="del"){
            rows=rows.filter(x=>x.id!==r.id);renderRows();return;
          }
          if(f==="type")r.type=inp.value;
          else r[f]=Math.max(1,parseInt(inp.value)||1);
        });
      });
      wrap.appendChild(row);
    });
  }
  q(box,"#b_add").onclick=()=>{
    const nextId=rows.reduce((m,r)=>Math.max(m,r.id),0)+1;
    rows.push({id:nextId,type:"small",rows:6,cols:10});
    renderRows();
  };
  q(box,"#b_save").onclick=async()=>{
    try{
      await apiWrite("/api/boxes",{boxes:rows});
      _locData=null;
      toast("库位定义已保存");
    }catch(e){toast(e.message)}
  };
  load();
  return{reload:load};
}
